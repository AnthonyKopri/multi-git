# Continuous integration.
#
# Windows and macOS are native targets. Both macOS CPU families run separately:
# a build that happens to cross-package is not proof that process execution,
# bundle metadata, or filesystem handling works on that architecture.
name: CI

on:
  push:
    # Keep the one-off Mac handoff branch buildable before its PR exists. Forks
    # still use the pull_request trigger when they open their PR.
    branches: [main, codex/macos-parity-handoff]
  pull_request:
  workflow_dispatch:

# A new push supersedes an in-flight run for the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15, macos-15-intel]
        # The floor declared in package.json engines, and the version Electron
        # 43 actually embeds. A break in either is a break for real users.
        node: ['22.12', '24']
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck and test
        # No SSH agent: unit tests must not reach for developer credentials.
        env:
          SSH_AUTH_SOCK: ''
        run: npm test

      - name: Compile
        run: npm run compile

  no-host-tooling:
    name: test without gh or an ssh agent
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'
          cache: npm

      - name: Install
        run: npm ci

      - name: Remove the GitHub CLI from PATH
        # Runners ship gh pre-installed and authenticated against the workflow
        # token. A user's machine usually has neither, and every code path that
        # asks about gh has to behave when the answer is "not installed".
        run: |
          if command -v gh >/dev/null 2>&1; then
            sudo mv "$(command -v gh)" /tmp/gh-disabled
          fi
          ! command -v gh

      - name: Typecheck and test
        env:
          SSH_AUTH_SOCK: ''
          GH_TOKEN: ''
          GITHUB_TOKEN: ''
        run: npm test

  docs:
    name: docs and whitespace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Needed so the whitespace check below can find a merge base.
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'
          cache: npm

      - name: Install
        run: npm ci

      - name: Check Markdown links
        run: npm run lint:links

      - name: Check for whitespace errors introduced by this change
        # Scoped to the merge base rather than the whole tree. public/index.html
        # and public/style.css carry pre-existing trailing whitespace; failing
        # every run on it would just train people to ignore this job, and
        # reformatting two shared files is not this check's job to force.
        run: |
          base="origin/${{ github.base_ref || github.event.repository.default_branch }}"
          if git rev-parse --verify --quiet "$base" >/dev/null; then
            git diff --check "$(git merge-base "$base" HEAD)" HEAD
          else
            echo "No base ref to compare against; checking the working tree only."
            git diff --check
          fi

  package:
    name: Windows packaging smoke
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'
          cache: npm

      - name: Install
        run: npm ci

      - name: Compile
        run: npm run compile

      - name: Package (unpacked)
        # --dir stops before building the NSIS installer, which is the slow
        # half and not what this is checking. What it does check is the part
        # that actually breaks: whether build.files still covers everything the
        # app loads at runtime.
        run: npx electron-builder --win --dir --publish never

      - name: Verify the packaged app
        shell: pwsh
        run: |
          $asar = Get-ChildItem -Path dist -Recurse -Filter app.asar | Select-Object -First 1
          if (-not $asar) { throw 'electron-builder produced no app.asar' }

          $listing = npx --yes @electron/asar list $asar.FullName
          if (-not ($listing | Select-String -Pattern 'main\.js' -SimpleMatch:$false -Quiet)) {
            throw 'app.asar does not contain out/node/main/main.js'
          }

          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $exe = Get-ChildItem -Path dist -Recurse -Filter "$($package.build.productName).exe" | Select-Object -First 1
          if (-not $exe) { throw "Packaged executable was not found" }

          $info = $exe.VersionInfo
          $expectedStrings = @{
            ProductName = $package.build.productName
            FileDescription = $package.description
            OriginalFilename = "$($package.build.productName).exe"
          }
          foreach ($field in $expectedStrings.Keys) {
            if ($info.$field -ne $expectedStrings[$field]) {
              throw "$field is '$($info.$field)', expected '$($expectedStrings[$field])'"
            }
          }
          foreach ($field in @('FileVersion', 'ProductVersion')) {
            if (-not $info.$field.StartsWith($package.version)) {
              throw "$field is '$($info.$field)', expected version $($package.version)"
            }
          }

          Write-Output "Packaged $($exe.FullName) with $($info.ProductName) $($info.ProductVersion)"

  package-macos:
    name: macOS packaging smoke (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Standard native runners as of 2026: macos-15 is Apple Silicon and
          # macos-15-intel is the pinned x64 image (available through Aug 2027).
          - os: macos-15
            arch: arm64
            mach_arch: arm64
            app_dir: dist/mac-arm64/Multi-Git Client.app
          - os: macos-15-intel
            arch: x64
            mach_arch: x86_64
            app_dir: dist/mac/Multi-Git Client.app
    env:
      # Pull requests deliberately produce unsigned smoke packages. The release
      # workflow requires credentials unless unsigned output is explicitly opted in.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22.12'
          cache: npm

      - name: Install
        run: npm ci

      - name: Build native DMG and ZIP
        run: npm run build-mac:${{ matrix.arch }}

      - name: Verify the macOS packages
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          dmg="dist/Multi-Git-Client-macOS-${version}-${{ matrix.arch }}.dmg"
          zip="dist/Multi-Git-Client-macOS-${version}-${{ matrix.arch }}.zip"
          test -s "$dmg"
          test -s "$zip"

          app='${{ matrix.app_dir }}'
          test -d "$app"
          asar="$app/Contents/Resources/app.asar"
          test -f "$asar"
          npx --no-install asar list "$asar" | grep -q 'out/node/main/main.js'

          bundle_id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Contents/Info.plist")
          test "$bundle_id" = 'com.multigit.client'
          folder_type=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleDocumentTypes:0:LSItemContentTypes:0' "$app/Contents/Info.plist")
          test "$folder_type" = 'public.folder'

          executable="$app/Contents/MacOS/Multi-Git Client"
          archs=$(lipo -archs "$executable")
          case " $archs " in
            *" ${{ matrix.mach_arch }} "*) ;;
            *) echo "Expected ${{ matrix.mach_arch }} executable, found: $archs" >&2; exit 1 ;;
          esac

      - name: Keep downloadable unsigned smoke packages
        uses: actions/upload-artifact@v4
        with:
          name: macos-smoke-${{ matrix.arch }}
          path: |
            dist/Multi-Git-Client-macOS-*-${{ matrix.arch }}.dmg
            dist/Multi-Git-Client-macOS-*-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 14
          # DMG and ZIP are already compressed; recompressing only wastes CI time.
          compression-level: 0
