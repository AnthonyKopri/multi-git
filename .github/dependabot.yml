# Dependabot configuration.
#
# Grouping is the load-bearing part. Almost every dependency in this project is
# transitive through electron-builder, so a single upstream release closes ten
# advisories at once; ungrouped, that produced four PRs that all bumped the
# same package and conflicted with one another in package-lock.json.
#
# Security advisories are ungated and grouped into one PR. Routine version
# updates are now enabled too, but deliberately shaped:
#
#   * Minor and patch updates are grouped by area and land monthly, so the
#     toolchain does not drift a year behind between release trains again.
#
#   * Majors are excluded from every group. Electron, TypeScript, and Vitest
#     majors each need a migration pass — Electron 43 changed how the runtime
#     is installed, TypeScript 7 dropped the legacy module resolver — and that
#     belongs in a PR of its own with a human reading the migration guide.
#
#   * Version updates wait a week after a release (cooldown). The npm worms of
#     2025 and 2026 published poisoned patch releases of popular packages that
#     were caught and pulled within hours to days; a week keeps those out of a
#     routine bump. Security updates are not held back by it.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 14
    # Enough for the groups below plus a major or two, without burying the
    # pull request list.
    open-pull-requests-limit: 5
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

      electron-toolchain:
        applies-to: version-updates
        patterns:
          - electron
          - electron-builder
          - "@electron/*"
          - resedit
        update-types:
          - minor
          - patch

      typescript-toolchain:
        applies-to: version-updates
        patterns:
          - typescript
          - esbuild
          - "@types/*"
        update-types:
          - minor
          - patch

      test-toolchain:
        applies-to: version-updates
        patterns:
          - vitest
          - vite
          - supertest
        update-types:
          - minor
          - patch

      # What ships inside the app and the terminal edition.
      runtime:
        applies-to: version-updates
        patterns:
          - express
          - zod
          - react
          - ink
          - tar
          - yauzl
          - "@modelcontextprotocol/*"
        update-types:
          - minor
          - patch

    ignore:
      # @types/node tracks the Node major that Electron embeds, not the newest
      # published. Electron 45 embeds Node 24, so 25 and 26 would describe
      # APIs the runtime does not have. Raise this with the Electron major.
      - dependency-name: "@types/node"
        versions: [">=25"]

  # The workflows' actions, pinned to commit SHAs. Dependabot moves the SHA and
  # the version comment beside it together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns:
          - "*"
