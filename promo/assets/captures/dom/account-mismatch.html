<!-- #confirm-modal -->
<div id="confirm-modal" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="confirm-title">
    <div class="modal-card modal-small">
      <div class="modal-header">
        <h2 id="confirm-title">Account mismatch</h2>
      </div>
      <div class="modal-body">
        <p id="confirm-message" class="confirm-message">Your auto-select rules map this remote to account "Work", but you're pushing with "Personal". Push anyway?</p>
        <label id="confirm-checkbox-row" class="amend-row hidden">
          <input type="checkbox" id="confirm-checkbox">
          <span id="confirm-checkbox-label">Keep the current commit identity (jane@acme.example)</span>
        </label>
        <div class="form-actions">
          <button type="button" id="btn-confirm-cancel" class="btn btn-secondary">Cancel</button>
          <button type="button" id="btn-confirm-ok" class="btn btn-danger">Push Anyway</button>
        </div>
      </div>
    </div>
  </div>
